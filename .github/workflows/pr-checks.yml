name: Lint and Test Checks

on:
  pull_request:
    branches:
      - develop
      - production
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app/api
        run: npm install

      - name: Run Lint
        working-directory: app/api
        run: npm run lint

      - name: Run Tests
        working-directory: app/api
        run: npm run test
